<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Doubao2API 控制台</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e6e8ec; --dim:#9aa3b2; --accent:#4f8cff; --ok:#3ecf8e;
    --warn:#f0b429; --err:#f2555a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
    padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  header .sp{flex:1}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
    font-size:12px;border:1px solid var(--line);background:var(--panel2);color:var(--dim)}
  .badge.ok{color:var(--ok);border-color:#1f5c43}
  .badge.err{color:var(--err);border-color:#5c1f22}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  main{padding:18px;max-width:1180px;margin:0 auto}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  nav button{background:transparent;border:1px solid transparent;color:var(--dim);padding:7px 13px;
    border-radius:8px;cursor:pointer;font-size:13px}
  nav button:hover{color:var(--fg);background:var(--panel2)}
  nav button.on{color:var(--fg);background:var(--panel2);border-color:var(--line)}
  section{display:none} section.on{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .card h2{font-size:13px;margin:0 0 12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpi .v{font-size:24px;font-weight:600;margin-top:4px}
  .kpi .k{font-size:12px;color:var(--dim)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  tbody tr:hover{background:var(--panel2)}
  td.mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  .muted{color:var(--dim)}
  .trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button.btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:6px 11px;
    border-radius:7px;cursor:pointer;font-size:12.5px}
  button.btn:hover{border-color:#3a4150}
  button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.btn.danger{color:var(--err)}
  button.btn:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    padding:7px 10px;border-radius:7px;font:inherit;font-size:13px;min-width:0}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .toast{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--line);
    border-left:3px solid var(--accent);padding:10px 14px;border-radius:8px;max-width:420px;
    box-shadow:0 8px 30px rgba(0,0,0,.45);display:none;white-space:pre-wrap;word-break:break-word}
  .toast.show{display:block}
  .toast.err{border-left-color:var(--err)}
  .toast.ok{border-left-color:var(--ok)}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
  .hint{color:var(--dim);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>Doubao2API 控制台</h1>
  <span id="health" class="badge"><i class="dot"></i><span>检测中…</span></span>
  <span class="sp"></span>
  <input id="pw" type="password" placeholder="管理密码（如已设置）" autocomplete="current-password" style="width:190px">
  <button class="btn" id="savePw">记住</button>
  <button class="btn primary" id="refresh">刷新</button>
</header>

<main>
  <nav>
    <button data-tab="overview" class="on">概览</button>
    <button data-tab="accounts">账号</button>
    <button data-tab="keys">密钥</button>
    <button data-tab="logs">日志</button>
    <button data-tab="settings">设置</button>
  </nav>

  <section id="tab-overview" class="on">
    <div class="cards" id="kpis"></div>
    <div class="card">
      <h2>模型</h2>
      <table><thead><tr><th>ID</th><th>名称</th><th>档位</th><th>上下文</th><th>说明</th></tr></thead>
      <tbody id="models"></tbody></table>
    </div>
  </section>

  <section id="tab-accounts">
    <div class="card">
      <h2>账号池</h2>
      <div class="row" style="margin-bottom:12px">
        <button class="btn primary" id="importLocal">导入本机桌面端</button>
        <button class="btn" id="checkinAll">全部探活</button>
        <button class="btn" id="qrLogin">扫码登录</button>
        <span class="sp" style="flex:1"></span>
        <input id="manualName" placeholder="账号名称（可选）" style="width:170px">
        <input id="manualCookies" placeholder="粘贴 Cookie 串：sessionid=…; sid_guard=…" style="width:330px">
        <button class="btn" id="addManual">手工录入</button>
      </div>
      <table><thead><tr><th>名称</th><th>来源</th><th>会话</th><th>状态</th><th>Cookie</th><th>失败</th><th>最近使用</th><th>操作</th></tr></thead>
      <tbody id="accounts"></tbody></table>
      <div class="card" id="qrPanel" style="display:none;margin-top:14px">
        <h2>扫码登录</h2>
        <div class="row">
          <img id="qrImg" alt="二维码" style="width:200px;height:200px;background:#fff;border-radius:8px;padding:6px">
          <div>
            <div id="qrStatus" class="muted">等待扫码…</div>
            <div class="hint">使用「抖音 APP」扫码，并在手机上确认登录。</div>
            <button class="btn danger" id="qrCancel" style="margin-top:10px">取消</button>
          </div>
        </div>
      </div>
      <div class="hint">凭据已脱敏展示。导入 / 手工录入的完整 Cookie 仅存于本机状态文件。</div>
    </div>
  </section>

  <section id="tab-keys">
    <div class="card">
      <h2>API 密钥</h2>
      <div class="row" style="margin-bottom:12px">
        <input id="keyName" placeholder="密钥备注（可选）" style="width:200px">
        <button class="btn primary" id="addKey">创建密钥</button>
      </div>
      <table><thead><tr><th>密钥</th><th>备注</th><th>状态</th><th>请求数</th><th>创建时间</th><th>最近使用</th><th>操作</th></tr></thead>
      <tbody id="keys"></tbody></table>
      <div class="hint">密钥已脱敏。完整密钥只在创建时返回一次，请立即保存。<br>
        未签发任何密钥时，<code>/v1/*</code> 允许无密钥调用。</div>
    </div>
  </section>

  <section id="tab-logs">
    <div class="card">
      <h2>请求日志</h2>
      <div class="row" style="margin-bottom:12px">
        <select id="logLimit"><option value="50">最近 50</option><option value="200">最近 200</option><option value="0">全部</option></select>
        <button class="btn" id="reloadLogs">刷新</button>
        <button class="btn danger" id="clearLogs">清空</button>
      </div>
      <table><thead><tr><th>时间</th><th>模型</th><th>流式</th><th>状态</th><th>耗时</th><th>入/出</th><th>账号</th><th>密钥</th><th>错误</th></tr></thead>
      <tbody id="logs"></tbody></table>
      <div class="hint">只记录元信息（模型、耗时、长度），不落对话内容。</div>
    </div>
  </section>

  <section id="tab-settings">
    <div class="card">
      <h2>运行设置</h2>
      <div class="grid2">
        <div><label>请求超时（秒）</label><input id="sTimeout" type="number" min="1"></div>
        <div><label>最大重试次数</label><input id="sRetries" type="number" min="1"></div>
        <div><label>日志保留条数</label><input id="sLogKeep" type="number" min="1"></div>
        <div><label>CORS 允许来源（逗号分隔，留空=仅本机）</label><input id="sCors" placeholder="http://192.168.1.10:8080"></div>
      </div>
      <label>模型别名（JSON，如 <code>{"gpt-4o":"doubao"}</code>）</label>
      <textarea id="sAliases" spellcheck="false"></textarea>
      <label>管理密码（留空则保持 / 清除；设置后管理接口必须携带）</label>
      <input id="sPw" type="password" placeholder="不修改请留空" style="width:280px">
      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="saveSettings">保存设置</button>
        <button class="btn danger" id="clearStats">重置统计</button>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var state = { data:null };

  function toast(msg, kind){
    var t = $("#toast");
    t.textContent = msg;
    t.className = "toast show " + (kind||"");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.className = "toast"; }, 4200);
  }
  function pw(){ return $("#pw").value.trim(); }

  function api(path, opts){
    opts = opts || {};
    var h = { "Content-Type":"application/json" };
    if (pw()) h["X-Admin-Password"] = pw();
    return fetch(path, {
      method: opts.method || "GET",
      headers: h,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function(r){
      return r.text().then(function(txt){
        var j = null;
        try { j = JSON.parse(txt); } catch(e){}
        if (!r.ok) {
          var m = (j && j.error && j.error.message) || txt || ("HTTP " + r.status);
          var err = new Error(m); err.status = r.status; throw err;
        }
        return j;
      });
    });
  }

  // --- DOM 构建助手（全程 textContent，绝不拼接 HTML） ---
  function mk(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function cell(text, cls){ return mk("td", cls, text); }
  function row(cells){
    var r = mk("tr");
    for (var i = 0; i < cells.length; i++) r.appendChild(cells[i]);
    return r;
  }
  function pill(text, cls){ return mk("span", "badge " + (cls||""), text); }
  function emptyRow(cols, text){
    var c = cell(text, "muted");
    c.colSpan = cols;
    var r = mk("tr");
    r.appendChild(c);
    return r;
  }
  function btn(label, cls, fn){
    var b = mk("button", "btn " + (cls||""), label);
    b.type = "button";
    b.onclick = fn;
    return b;
  }

  function fmtTime(s){
    if (!s) return "—";
    var d = new Date(s * 1000);
    var p = function(n){ return (n<10?"0":"")+n; };
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
  }

  function setHealth(cls, text){
    var el = $("#health");
    el.className = "badge " + cls;
    el.textContent = "";
    el.appendChild(mk("i", "dot"));
    el.appendChild(mk("span", null, text));
  }

  function loadHealth(){
    fetch("/health").then(function(r){ return r.json(); }).then(function(h){
      var ready = h.ready || 0, total = h.accounts || 0;
      var ok = total > 0 && ready > 0;
      setHealth(ok ? "ok" : (total === 0 ? "" : "err"),
        "账号 "+ready+"/"+total+" 就绪 · 模型 "+(h.models||0));
    }).catch(function(){ setHealth("err", "不可达"); });
  }

  function renderOverview(d){
    var s = d.stats || {};
    var accts = d.accounts || [];
    var ready = accts.filter(function(a){ return a.enabled && a.status === "ok"; }).length;
    var kpis = [
      ["总请求", s.total_requests || 0],
      ["失败请求", s.failed_requests || 0],
      ["输出字符", s.total_chars_out || 0],
      ["账号（就绪/总）", ready + " / " + accts.length],
      ["密钥", (d.keys||[]).length],
      ["启动时间", fmtTime(s.started_at)]
    ];
    var box = $("#kpis");
    box.textContent = "";
    kpis.forEach(function(k){
      var c = mk("div", "kpi");
      c.appendChild(mk("div", "k", k[0]));
      c.appendChild(mk("div", "v", k[1]));
      box.appendChild(c);
    });

    var tb = $("#models");
    tb.textContent = "";
    var models = d.models || [];
    if (!models.length) { tb.appendChild(emptyRow(5, "无")); return; }
    models.forEach(function(m){
      tb.appendChild(row([
        cell(m.id, "mono"), cell(m.name), cell(m.think_level),
        cell(m.context, "mono"), cell(m.description, "muted")
      ]));
    });
  }

  function renderAccounts(d){
    var tb = $("#accounts");
    tb.textContent = "";
    var accts = d.accounts || [];
    if (!accts.length) {
      tb.appendChild(emptyRow(8, "暂无账号，点击「导入本机桌面端」或「手工录入」"));
      return;
    }
    accts.forEach(function(a){
      var statusCell = cell("");
      if (a.enabled) {
        var okStatus = a.status === "ok";
        statusCell.appendChild(pill(okStatus ? "ok" : (a.status || "error"), okStatus ? "ok" : "err"));
      } else {
        statusCell.appendChild(pill("已停用"));
      }

      var ops = cell("");
      ops.appendChild(btn("探活", "", function(){ checkin(a.id); }));
      ops.appendChild(document.createTextNode(" "));
      ops.appendChild(btn(a.enabled ? "停用" : "启用", "", function(){ accountOp("toggle", {id:a.id}); }));
      if (a.failures > 0) {
        ops.appendChild(document.createTextNode(" "));
        ops.appendChild(btn("清错", "", function(){ accountOp("clear-errors", {id:a.id}); }));
      }
      ops.appendChild(document.createTextNode(" "));
      ops.appendChild(btn("删除", "danger", function(){
        if (confirm("确定删除账号 " + a.name + "？")) accountOp("remove", {id:a.id});
      }));

      var r = row([
        cell(a.name), cell(a.source, "muted"), cell(a.session, "mono"), statusCell,
        cell(a.cookie_count, "mono"), cell(a.failures, "mono"),
        cell(fmtTime(a.last_used), "muted"), ops
      ]);
      if (a.last_err) r.title = a.last_err;
      tb.appendChild(r);
    });
  }

  function renderKeys(d){
    var tb = $("#keys");
    tb.textContent = "";
    var keys = d.keys || [];
    if (!keys.length) {
      tb.appendChild(emptyRow(7, "暂无密钥（未签发时 /v1 允许无密钥调用）"));
      return;
    }
    keys.forEach(function(k){
      var st = cell("");
      st.appendChild(pill(k.enabled ? "启用" : "停用", k.enabled ? "ok" : ""));
      var ops = cell("");
      ops.appendChild(btn(k.enabled ? "停用" : "启用", "", function(){ keyOp("toggle", k.key); }));
      ops.appendChild(document.createTextNode(" "));
      ops.appendChild(btn("删除", "danger", function(){
        if (confirm("确定删除该密钥？")) keyOp("key", k.key);
      }));
      tb.appendChild(row([
        cell(k.key, "mono"), cell(k.name), st, cell(k.requests, "mono"),
        cell(fmtTime(k.created_at), "muted"), cell(fmtTime(k.last_used), "muted"), ops
      ]));
    });
  }

  function renderLogs(logs){
    var tb = $("#logs");
    tb.textContent = "";
    if (!logs || !logs.length) { tb.appendChild(emptyRow(9, "暂无日志")); return; }
    logs.forEach(function(l){
      var st = cell("");
      st.appendChild(pill(l.status, l.status >= 400 ? "err" : "ok"));
      var errCell = cell(l.err || "", "muted trunc");
      if (l.err) errCell.title = l.err;
      tb.appendChild(row([
        cell(fmtTime(l.time), "muted"), cell(l.model, "mono"), cell(l.stream ? "是" : "否", "mono"),
        st, cell(l.latency_ms + "ms", "mono"), cell(l.prompt_len + " / " + l.output_len, "mono"),
        cell(l.account, "mono"), cell(l.key, "mono"), errCell
      ]));
    });
  }

  function renderSettings(s){
    $("#sTimeout").value = s.request_timeout_sec || "";
    $("#sRetries").value = s.max_retries || "";
    $("#sLogKeep").value = s.log_keep || "";
    $("#sCors").value = s.cors_origin || "";
    $("#sAliases").value = JSON.stringify(s.model_aliases || {}, null, 2);
    $("#sPw").placeholder = s.admin_password_set ? "已设置，留空则不修改" : "未设置";
  }

  function refresh(){
    return api("/admin/api/state").then(function(d){
      state.data = d;
      renderOverview(d);
      renderAccounts(d);
      renderKeys(d);
      renderSettings(d.settings || {});
      loadHealth();
    }).catch(function(e){
      toast("加载失败：" + e.message + (e.status===401 ? "\n请在右上角填写管理密码" : ""), "err");
    });
  }
  function refreshLogs(){
    var limit = $("#logLimit").value;
    return api("/admin/api/logs?limit=" + encodeURIComponent(limit)).then(function(d){
      renderLogs(d.logs);
    }).catch(function(e){ toast("日志加载失败：" + e.message, "err"); });
  }

  function accountOp(action, extra){
    var body = { action: action };
    if (extra) for (var k in extra) body[k] = extra[k];
    return api("/admin/api/accounts", {method:"POST", body:body}).then(function(){
      toast("操作成功", "ok");
      return refresh();
    }).catch(function(e){ toast("失败：" + e.message, "err"); });
  }
  function keyOp(kind, key){
    return api("/admin/api/keys?" + kind + "=" + encodeURIComponent(key), {method:"DELETE"})
      .then(function(){ toast("操作成功","ok"); return refresh(); })
      .catch(function(e){ toast("失败：" + e.message, "err"); });
  }
  function checkin(id){
    toast("探活中，请稍候…");
    return api("/admin/api/checkin", {method:"POST", body: id ? {id:id} : {}}).then(function(r){
      var results = r.results || [];
      var bad = results.filter(function(x){ return !x.ok; });
      toast("探活完成：" + results.length + " 个账号，失败 " + bad.length +
        (bad.length ? "\n" + bad.map(function(x){ return x.name + ": " + x.err; }).join("\n") : ""),
        bad.length ? "err" : "ok");
      return refresh();
    }).catch(function(e){ toast("探活失败：" + e.message, "err"); });
  }

  // --- events ---
  document.querySelectorAll("nav button").forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll("nav button").forEach(function(x){ x.classList.remove("on"); });
      document.querySelectorAll("section").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      $("#tab-" + b.dataset.tab).classList.add("on");
      if (b.dataset.tab === "logs") refreshLogs();
    };
  });

  $("#savePw").onclick = function(){
    try { localStorage.setItem("doubao2api_pw", pw()); } catch(e){}
    toast("已记住管理密码", "ok");
    refresh();
  };
  $("#refresh").onclick = function(){ refresh(); if ($("#tab-logs").classList.contains("on")) refreshLogs(); };
  $("#importLocal").onclick = function(){ accountOp("import", {}); };
  $("#addManual").onclick = function(){
    var cookies = $("#manualCookies").value.trim();
    if (!cookies) { toast("请粘贴 Cookie 串", "err"); return; }
    accountOp("manual", {cookies:cookies, name:$("#manualName").value.trim()}).then(function(){
      $("#manualCookies").value = ""; $("#manualName").value = "";
    });
  };
  $("#checkinAll").onclick = function(){ checkin(null); };
  $("#addKey").onclick = function(){
    api("/admin/api/keys", {method:"POST", body:{name:$("#keyName").value.trim()}}).then(function(r){
      toast("已创建密钥（仅显示一次）：\n" + r.key, "ok");
      $("#keyName").value = "";
      return refresh();
    }).catch(function(e){ toast("创建失败：" + e.message, "err"); });
  };
  $("#reloadLogs").onclick = refreshLogs;
  $("#clearLogs").onclick = function(){
    if (!confirm("确定清空全部日志？")) return;
    api("/admin/api/logs", {method:"DELETE"}).then(function(){ toast("已清空","ok"); return refreshLogs(); })
      .catch(function(e){ toast("失败：" + e.message, "err"); });
  };
  $("#clearStats").onclick = function(){
    if (!confirm("确定重置统计？")) return;
    api("/admin/api/stats", {method:"DELETE"}).then(function(){ toast("已重置","ok"); return refresh(); })
      .catch(function(e){ toast("失败：" + e.message, "err"); });
  };
  $("#saveSettings").onclick = function(){
    var aliases;
    try { aliases = JSON.parse($("#sAliases").value || "{}"); }
    catch(e){ toast("模型别名不是合法 JSON", "err"); return; }
    var body = {
      model_aliases: aliases,
      request_timeout_sec: parseInt($("#sTimeout").value, 10) || 0,
      max_retries: parseInt($("#sRetries").value, 10) || 0,
      log_keep: parseInt($("#sLogKeep").value, 10) || 0,
      cors_origin: $("#sCors").value.trim()
    };
    var np = $("#sPw").value;
    if (np !== "") body.admin_password = np;
    api("/admin/api/settings", {method:"POST", body:body}).then(function(r){
      $("#sPw").value = "";
      toast("设置已保存", "ok");
      renderSettings(r.settings || {});
      if (np !== "") { try { localStorage.setItem("doubao2api_pw", np); $("#pw").value = np; } catch(e){} }
      return refresh();
    }).catch(function(e){ toast("保存失败：" + e.message, "err"); });
  };
  $("#logLimit").onchange = refreshLogs;

  var qrTimer = null, qrSid = null;
  function stopQR(){
    if (qrTimer) { clearInterval(qrTimer); qrTimer = null; }
    qrSid = null;
  }
  function pollQR(){
    if (!qrSid) return;
    api("/admin/api/login/qrcode/poll", {method:"POST", body:{session_id:qrSid}}).then(function(r){
      var map = {waiting:"等待扫码…", scanned:"已扫码，请在手机上确认", confirmed:"登录成功", expired:"二维码已过期"};
      $("#qrStatus").textContent = map[r.status] || r.status;
      if (r.status === "confirmed") {
        stopQR();
        $("#qrPanel").style.display = "none";
        toast("扫码登录成功：" + (r.name || ""), "ok");
        refresh();
      } else if (r.status === "expired") {
        stopQR();
      }
    }).catch(function(e){ stopQR(); toast("轮询失败：" + e.message, "err"); });
  }
  $("#qrLogin").onclick = function(){
    api("/admin/api/login/qrcode", {method:"POST"}).then(function(r){
      $("#qrImg").src = r.qrcode;
      $("#qrStatus").textContent = "等待扫码…";
      $("#qrPanel").style.display = "block";
      stopQR();
      qrSid = r.session_id;
      qrTimer = setInterval(pollQR, 2000);
    }).catch(function(e){ toast("获取二维码失败：" + e.message, "err"); });
  };
  $("#qrCancel").onclick = function(){ stopQR(); $("#qrPanel").style.display = "none"; };

  try { var saved = localStorage.getItem("doubao2api_pw"); if (saved) $("#pw").value = saved; } catch(e){}
  $("#pw").addEventListener("keydown", function(e){ if (e.key === "Enter") { $("#savePw").click(); } });

  refresh();
  setInterval(loadHealth, 20000);
})();
</script>
</body>
</html>
